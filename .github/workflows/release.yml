name: Publish v1.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to recover
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  npm:
    name: Publish npm packages
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # npm 12 changed OIDC publishing behavior after v1.1.1. Stay on the
      # supported v11 line until the release path is verified against v12.
      - run: npm install --global npm@11.19.0
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  pypi:
    name: Publish Python package
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          print-hash: true

  release:
    name: Create GitHub release
    needs: [npm, pypi]
    if: always() && needs.npm.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Accessibility Devkit $RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}

  verify-installs:
    name: Verify registry installs
    needs: [npm, pypi]
    if: always() && needs.npm.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npx --yes @accessibility-devkit/cli@1.1.2 contrast '#000000' '#ffffff'
      - run: python -m pip install accessibility-devkit==1.1.2
      - run: accessibility-devkit contrast '#000000' '#ffffff'
